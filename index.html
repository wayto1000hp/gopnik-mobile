    <script>
(async function () {
 try {
  const r=await fetch('dosbox.mem.gz');
  if(!r.ok) throw new Error('HTTP '+r.status);
  if(!('DecompressionStream' in window)) throw new Error('Нужен современный Chrome с DecompressionStream');
  const stream=r.body.pipeThrough(new DecompressionStream('gzip'));
  const buffer=await new Response(stream).arrayBuffer();
  window.GOP_MEM_URL=URL.createObjectURL(new Blob([buffer]));
  const script=document.createElement('script');script.src='main.js';document.head.appendChild(script);
 } catch(e) { document.getElementById('status').textContent='Ошибка загрузки: '+e.message;console.error(e); }
})();
</script>

    <body>
        <div id="gameviewport"><canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas></div>

        <div id="status" class="notice center">Downloading...</div>

        <a class="btn fullscreen" href="javascript:{}" onclick="document.getElementById('canvas').webkitRequestFullscreen()"><i class="fa fa-expand"></i></a>
    <div id="touchpad"><div class="hint"><span>ГОПНИК</span><span class="zoom-controls"><button id="zoomout" type="button">−</button><span id="zoomvalue">140%</span><button id="zoomin" type="button">+</button></span></div>
<div class="entry"><input id="command" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Имя или команда (например help)"><button id="send" type="button">ВВОД ↵</button></div>
<div class="keys">
<button data-k="49">1</button><button data-k="50">2</button><button data-k="51">3</button><button data-k="52">4</button><button data-k="53">5</button>
<button data-k="54">6</button><button data-k="55">7</button><button data-k="56">8</button><button data-k="57">9</button><button data-k="48">0</button>
<button data-k="38">↑</button><button data-k="37">←</button><button data-k="40">↓</button><button data-k="39">→</button><button data-k="13">ENTER</button>
<button data-k="27">ESC</button><button data-k="32">ПРОБЕЛ</button><button data-k="8">⌫</button><button data-k="89">Y</button><button data-k="78">N</button>
</div></div><script>
(function(){
var zoom=112;var canvas=document.getElementById('canvas');
function setZoom(v){zoom=Math.max(100,Math.min(160,v));canvas.style.setProperty('width',zoom+'vw','important');document.getElementById('zoomvalue').textContent=zoom+'%';}
document.getElementById('zoomin').addEventListener('click',function(){setZoom(zoom+10)});
document.getElementById('zoomout').addEventListener('click',function(){setZoom(zoom-10)});
setZoom(112);
var codes={13:'Enter',27:'Escape',32:'Space',8:'Backspace',37:'ArrowLeft',38:'ArrowUp',39:'ArrowRight',40:'ArrowDown'};
function emit(code,down){
 var key=codes[code]||(code>=65&&code<=90?String.fromCharCode(code).toLowerCase():String.fromCharCode(code));
 var physicalCode=code>=48&&code<=57?'Digit'+String.fromCharCode(code):code>=65&&code<=90?'Key'+String.fromCharCode(code):({13:'Enter',27:'Escape',32:'Space',8:'Backspace',37:'ArrowLeft',38:'ArrowUp',39:'ArrowRight',40:'ArrowDown'}[code]||key);
 var target=document.getElementById('canvas');
 // Older Emscripten/DOSBox builds may listen on window, document, or canvas.
 [window,document,target].forEach(function(el){
  var e=new KeyboardEvent(down?'keydown':'keyup',{key:key,code:physicalCode,bubbles:true,cancelable:true});
  try{Object.defineProperty(e,'keyCode',{get:function(){return code}});Object.defineProperty(e,'which',{get:function(){return code}})}catch(ex){}
  el.dispatchEvent(e);
 });
}
var queue=Promise.resolve();
function stroke(code){queue=queue.then(function(){return new Promise(function(resolve){emit(code,true);setTimeout(function(){emit(code,false);setTimeout(resolve,35)},65)})})}
function sendText(str){for(var c of str){var n=c.charCodeAt(0);if(n>=65&&n<=90)n+=32;if(n>=97&&n<=122||n>=48&&n<=57||n===32)stroke(n);else if(c==='-')stroke(189)}stroke(13)}
document.querySelectorAll('#touchpad [data-k]').forEach(function(b){b.addEventListener('click',function(e){e.preventDefault();document.getElementById('canvas').focus();stroke(Number(b.dataset.k))})});
var inp=document.getElementById('command');document.getElementById('send').addEventListener('click',function(){sendText(inp.value);inp.value='';inp.blur()});
inp.addEventListener('keydown',function(e){e.stopPropagation();if(e.key==='Enter'){e.preventDefault();document.getElementById('send').click()}});
})();
</script></body>
